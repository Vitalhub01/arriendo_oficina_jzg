# Deploy automático a Fly.io al hacer push a main.
# Repo secret requerido: FLY_API_TOKEN (fly tokens create deploy -x 999999h)

name: Fly Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-web:
    name: Deploy vitalhub-web
    runs-on: ubuntu-latest
    concurrency: fly-deploy-web
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.web.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-worker:
    name: Deploy vitalhub-worker
    runs-on: ubuntu-latest
    needs: deploy-web
    concurrency: fly-deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.worker.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
