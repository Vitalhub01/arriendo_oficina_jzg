supabase:
  service: S3
  access_key_id: <%= ENV["SUPABASE_S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["SUPABASE_S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("SUPABASE_S3_REGION", "us-east-1") %>
  bucket: <%= ENV["SUPABASE_STORAGE_BUCKET"] %>
  endpoint: <%= ENV["SUPABASE_STORAGE_ENDPOINT"].presence || "https://#{ENV.fetch('SUPABASE_PROJECT_REF', 'placeholder')}.storage.supabase.co/storage/v1/s3" %>
  force_path_style: true

amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV["AWS_BUCKET"] %>

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>
