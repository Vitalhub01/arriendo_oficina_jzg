# Respaldo horario: la expiración normal va en ExpirePendingJob programado al crear la reserva.
expire_pending_bookings:
  cron: "0 * * * *"
  class: "Bookings::ExpirePendingJob"
  queue: default

complete_past_bookings:
  cron: "0 2 * * *"
  class: "Bookings::CompletePastJob"
  queue: default

maintain_booking_series:
  cron: "0 3 * * 1"
  class: "MaintainBookingSeriesJob"
  queue: default

maintain_schedule_blocks:
  cron: "30 3 * * *"
  class: "MaintainScheduleBlocksJob"
  queue: default

expire_memberships:
  cron: "0 4 * * *"
  class: "Memberships::ExpireJob"
  queue: default

# Recordatorio: PaymentExpiryReminderJob programado al crear la reserva (sin cron).
