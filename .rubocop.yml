plugins:
  - rubocop-rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "db/schema.rb"
    - "bin/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

Style/Documentation:
  Enabled: false

Rails/I18nLocaleTexts:
  Enabled: false

Metrics/BlockLength:
  Max: 50
  Exclude:
    - "config/**/*"
    - "db/migrate/**/*"
    - "config/routes.rb"
    - "test/**/*"
    - "db/seeds.rb"

Metrics/AbcSize:
  Max: 60
  Exclude:
    - "db/migrate/**/*"

Metrics/MethodLength:
  Max: 50
  Exclude:
    - "db/migrate/**/*"

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/ClassLength:
  Max: 250
  Exclude:
    - "test/**/*"

Rails/CreateTableWithTimestamps:
  Exclude:
    - "db/migrate/**/*"

Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - '^\s*#'

Security/Open:
  Exclude:
    - "db/seeds.rb"
