services:
  - type: web
    name: rentabox-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rentabox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rentabox-redis
          property: connectionString
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: APP_HOST
        value: rentabox.onrender.com
      - key: ACTIVE_STORAGE_SERVICE
        value: amazon
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-east-1

  - type: worker
    name: rentabox-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rentabox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rentabox-redis
          property: connectionString

  - type: redis
    name: rentabox-redis
    plan: starter
    ipAllowList: []

databases:
  - name: rentabox-db
    plan: starter
